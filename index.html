<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Merger - Juntar PDFs</title>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <section>
    <div class="tit">
      <h1 id="brand">UNIX.MERGE</h1>
      <p class="subtitle">Junte múltiplos arquivos PDF em um só</p>
    </div>
    <div class="container">
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">+</div>
        <div class="upload-text">Clique ou arraste arquivos aqui</div>
        <div class="upload-hint">Apenas arquivos PDF (Máx. 50MB cada)</div>
        <input type="file" id="fileInput" accept=".pdf" multiple />
      </div>

      <div class="file-list" id="fileList"></div>

      <button class="merge-btn" id="mergeBtn" disabled>Juntar Documentos</button>

      <button class="clear-btn" id="clearBtn" style="display: none">
        Limpar Tudo
      </button>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill">0%</div>
        </div>
      </div>

      <div class="message" id="message"></div>
    </div>
    </section>
    <script src="assets/script.js"></script>
  </body>
</html>
